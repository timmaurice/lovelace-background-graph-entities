services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    volumes:
      # Only tests and reports are mounted. Do NOT mount ./src or ./dist: the suite must
      # run against the bundle built inside the image (`RUN npm run build`), which
      # `up --build` rebuilds whenever the source changes. A ./dist mount would shadow it
      # with a stale (or missing) host bundle.
      - ./test/e2e:/app/test/e2e
      - ./playwright-report:/app/playwright-report
    environment:
      - CI=1
    command: npx playwright test
